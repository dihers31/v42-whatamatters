   ============================================================ */

:root {
  --f-condensed: 'Barlow Condensed', Impact, 'Arial Narrow', 'Franklin Gothic Medium', Arial, sans-serif;

  --rule-light: rgba(242,240,235,0.06);

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============================================================
   LOADING SCREEN — shown while JS detects device/lang
   ============================================================ */

  background: var(--black);
  color: var(--white);
  font-family: var(--f-body);
  margin: 0;
}

#loader {
  position: fixed;
  inset: 0;
  background: var(--black);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  z-index: 9999;
}

.loader-brand {
  font-family: var(--f-condensed);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--white);
}

.loader-dot {
  width: 6px;
  height: 6px;
  background: var(--red);
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.6); }
}

.loader-label {
  font-family: var(--f-condensed);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(242,240,235,0.3);
}

/* ============================================================
   FALLBACK UI — shown if JS fails completely
   ============================================================ */

  min-height: 100vh;
  padding: 32px 24px;
  background: var(--black);
}

.fb-header {

        + '<div class="b-triple-item desktop"><span class="b-triple-num">02 ——</span><div class="b-triple-q desktop">' + t.q2 + '</div><p class="b-triple-a">' + t.a2 + '</p></div>'
        + '<div class="b-triple-item desktop"><span class="b-triple-num">03 ——</span><div class="b-triple-q desktop">' + t.q3 + '</div><p class="b-triple-a">' + t.a3 + '</p></div>'
      + '</div>'
      + '<div class="b-banda desktop"><span class="b-banda-dollar desktop">$</span><div class="b-banda-vr"></div><div class="b-banda-text desktop">' + t.bandaText.replace('\n','<br>') + '</div><div class="b-banda-note">' + t.bandaNote.replace('\n','<br>') + '</div></div>'
      + '<div class="b-table-block"><div class="b-table-note desktop">' + t.tableNote + '</div>'
        + '<div class="b-table-head"><div class="b-th">' + t.thType + '</div><div class="b-th">' + t.thArea + '</div><div class="b-th" style="text-align:right">' + t.thMonth + '</div><div class="b-th" style="text-align:right">' + t.thYear + '</div></div>'
        + tableRows
        + '<div class="b-disclaimer desktop">' + t.disclaimer + '</div>'
      + '</div>'
      + '<div class="b-two-col">'
        + '<div class="b-col-l"><span class="b-sec-num">01 ——</span><div class="b-sec-title desktop">' + t.sec1title + '</div><ul class="b-check-list">' + checks(t.checks) + '</ul></div>'
        + '<div class="b-col-r"><span class="b-sec-num">02 ——</span><div class="b-sec-title desktop">' + t.sec2title + '</div>'
          + '<div class="b-convo-box desktop"><span class="b-convo-lbl">' + t.yourLine + '</span><p class="b-convo-text">' + t.convoText + '</p></div>'
          + '<div class="b-convo-alt desktop"><span class="b-convo-alt-lbl">' + t.ifPrice + '</span><p class="b-convo-text" style="font-style:normal;font-size:13px;color:rgba(242,240,235,.5)">' + t.ifPriceT + '</p></div>'
        + '</div>'
      + '</div>'
      + '<div class="b-three-col">'
        + '<div class="b-three-card"><span class="b-card-lbl desktop">' + t.gets + '</span><ul class="b-dot-list">' + dots(t.getsItems) + '</ul></div>'
        + '<div class="b-three-card"><span class="b-card-lbl red desktop">' + t.dont + '</span><ul class="b-dot-list">' + dots(t.dontItems) + '</ul></div>'
        + '<div class="b-three-card"><span class="b-card-lbl dim desktop">' + t.caseTitle + '</span><ul class="b-dot-list">' + dots(t.caseItems) + '</ul></div>'
      + '</div>'
      + '<div class="b-beta desktop"><span class="b-beta-tag desktop">' + t.betaTag + '</span><p class="b-beta-text">' + t.betaText + '</p></div>'
      + '<div class="b-close-grid">'
        + '<div class="b-close-left desktop"><div class="b-close-headline desktop">' + closeLines(t.closeH) + '</div><p class="b-close-sub desktop">' + t.closeSub + '</p></div>'
        + '<div class="b-benefit desktop"><span class="b-benefit-eye">' + t.benefitEye + '</span><div class="b-benefit-pct desktop">' + t.benefitPct + '</div><div class="b-benefit-desc desktop">' + t.benefitDesc + '</div><p class="b-benefit-detail desktop">' + t.benefitDet + '</p></div>'
      + '</div>'
      + '<footer class="b-footer desktop"><span class="b-footer-brand">' + t.brand + ' · Digital Studio</span><span class="b-footer-tag">' + t.footerTag + '</span></footer>'
    + '</div>';
  }
}

// Safety fallback — if something breaks, show the manual selector
window.addEventListener('error', function() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
});
